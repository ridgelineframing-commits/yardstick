[package]
name = "yardstick"
# Internal Rust crate version only. The app / installer version is single-sourced
# from package.json (tauri.conf.json reads it via "version": "../package.json").
version = "1.0.0"
description = "Yardstick — PDF Markup & Plan Takeoff, by Ridgeline"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
